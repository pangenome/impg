[package]
name = "impg"
version = "0.5.0"
edition = "2021"
authors = ["Andrea Guarracino <aguarracino@tgen.org>"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "gfaffix"
path = "vendor/gfaffix/src/main.rs"

# Release build with debug info for flamegraph / perf profiling.
# Build with: cargo build --profile profiling
[profile.profiling]
inherits = "release"
debug = true

[dependencies]
bincode = { version = "2.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.5", features = ["derive", "wrap_help", "cargo"] }
flate2 = { version = "1", features = ["zlib"], default-features = false }
gfa = "0.10.1"
coitrees = "0.4"
crossbeam-channel = "0.5"
num_cpus = "1.17"
rayon = "1.11"
noodles = { version = "0.100.0", features = ["bgzf"] }
regex = "1.12"
log = "0.4"
env_logger = "0.11"
natord = "1.0"
rustc-hash = "2.1"
libc = "0.2"
memmap2 = "0.9"
indexmap = { version = "2", features = ["rayon"] }
nalgebra = "0.33"
indicatif = "0.18"
spoa_rs = { git = "https://github.com/AndreaGuarracino/spoa-rs.git" }
poasta = "0.1.0"
rust-htslib = { version = "1.0.0", default-features = false, features = ["libdeflate"] }
csv = "1.3"
serde_json = "1.0"

# Dependencies for AGC format (for sequences) support
ragc-core = { git = "https://github.com/AndreaGuarracino/ragc", rev = "ebfa5eb243541a3d7a5e2f4e3ccb8961283149a0" }

# Dependencies for 1ALN format (for alignments) support
#onecode = { path = "/home/guarracino/git/onecode-rs" }
onecode = { git = "https://github.com/pangenome/onecode-rs", rev = "5fa1e9333f18b311580f1346751c630c626d8342" }
# Dependencies for TPA format (for alignments) support
#tpa = { path = "/home/guarracino/git/tpa" }
tpa = { git = "https://github.com/AndreaGuarracino/tpa", rev = "f21b0127c46646d0e73657ddd3162d0417e5c3c1" }
# Dependencies for 1ALN and TPA formats (for alignments) support
lib_wfa2 = { git = "https://github.com/AndreaGuarracino/lib_wfa2", rev = "787093a7880a26b1b9b25bdb038b899784e01c81" }
#lib_wfa2 = { path = "/home/guarracino/Dropbox/git//lib_wfa2"}
#tracepoints = { path = "/home/guarracino/Dropbox/git/tracepoints"}
tracepoints = { git = "https://github.com/GuarracinoLab/tracepoints", rev = "2aa427e774e66adab6e2a864f2ed2e865ca16f71" }

# Dependencies for lace functionality
handlegraph = { git = "https://github.com/chfi/rs-handlegraph", rev = "3ac575e4216ce16a16667503a8875e469a40a97a" }
bitvec = "1.0.1"
niffler = "3.0.0"
tempfile = "3.23.0"
zstd = { version = "0.13.3", features = ["zstdmt"] }
gzp = "1.0.1"

# Dependencies for graph building (sweepga + seqwish integration)
sweepga = { git = "https://github.com/pangenome/sweepga", rev = "1169dbb9a12f739d19cca6d86780841b550dfe8a", default-features = false }
# build.rs copies wfmash and the FastGA utilities next to the impg binary. Both
# crates export their binary directory as `links` metadata, which cargo passes
# only to direct dependents (DEP_WFMASH_BINDIR, DEP_FASTGA_BINDIR), so they are
# listed here although the code does not use them. Revisions must match the ones
# sweepga pins: cargo rejects two packages with the same `links` value.
wfmash-rs = { git = "https://github.com/pangenome/wfmash-rs", rev = "ee964dfef17522b40c3de306ab9231290186297a" }
fastga-rs = { git = "https://github.com/pangenome/fastga-rs", rev = "11bda8acd6c7409c4dfd117cf5b5df535d99e5a0" }
seqwish = { git = "https://github.com/pangenome/seqwish", branch = "rust-3" }
allwave = { git = "https://github.com/pangenome/allwave", rev = "a145a311f2d341b0a7d3747c46fd197bb34177d4", default-features = false }

# Dependencies for graph sorting
gfasort = { git = "https://github.com/pangenome/gfasort", rev = "4a8ff0028594e87607cb267f80f9ba6d31eb45be" }
povu = { package = "povu-rs", git = "https://github.com/pangenome/povu", rev = "0c9f21a40e7755293f5b21f33a7e2c894dc6cb15", default-features = false }

[build-dependencies]
cc = "1"

[dev-dependencies]
ahash = "0.8"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "crush"
harness = false

[features]
default = []

# It can be removed once the ragc PR is merged and we switch both impg and sweepga to the same upstream rev
[patch."https://github.com/ekg/ragc"]
ragc-core = { git = "https://github.com/AndreaGuarracino/ragc", rev = "ebfa5eb243541a3d7a5e2f4e3ccb8961283149a0" }
ragc-common = { git = "https://github.com/AndreaGuarracino/ragc", rev = "ebfa5eb243541a3d7a5e2f4e3ccb8961283149a0" }

# Redirect gfaffix's handlegraph = "0.7.0-alpha.9" to impg's pinned git rev (same API, 3 additive commits newer)
[patch.crates-io]
handlegraph = { git = "https://github.com/chfi/rs-handlegraph", rev = "3ac575e4216ce16a16667503a8875e469a40a97a" }
